version: '3.8'

services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: thestorybox-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thestorybox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend (NestJS) Service
  backend:
    container_name: thestorybox-backend
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    environment:
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: thestorybox_db
    depends_on:
      - db

  # Frontend (React + Vite) Service
  frontend:
    container_name: thestorybox-frontend
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
